<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Catatan Tugas</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f6a0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #b461a8;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        button {
            padding: 10px 15px;
            background-color: #d8a4d0;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #99d0e9;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #007bff;
        }
        li.completed {
            text-decoration: line-through;
            color: #888;
            border-left-color: #6c757d;
        }
        .delete-btn {
            background-color: #dc3545;
            padding: 4px 8px;
            font-size: 12px;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>tugas sak mben dino</h2>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Tulis tugas baru...">
        <button onclick="addTask()">Tambah</button>
    </div>
    <ul id="taskList"></ul>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="tanggal clear...">
        <button onclick="addTask()">clear</button>
    </div>
    <ul id="taskList"></ul>
</div>

<script>
    function addTask() {
        const input = document.getElementById('taskInput');
        const taskText = input.value.trim();

        if (taskText === '') {
            alert('Silakan tulis tugas terlebih dahulu!');
            return;
        }

        const li = document.createElement('li');
        
        // Teks tugas
        const span = document.createElement('span');
        span.textContent = taskText;
        span.style.cursor = 'pointer';
        span.onclick = function() {
            li.classList.toggle('completed');
        };

        // Tombol hapus
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Hapus';
        deleteBtn.className = 'delete-btn';
        deleteBtn.onclick = function() {
            li.remove();
        };

        li.appendChild(span);
        li.appendChild(deleteBtn);
        document.getElementById('taskList').appendChild(li);

        input.value = '';
    }
</script>

</body>
</html>
</head>

</html>
